
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppulse-api
  namespace: shoppulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoppulse-api
  template:
    metadata:
      labels:
        app: shoppulse-api
    spec:
      containers:
        - name: api
          image: ghcr.io/maruti1828/shoppulse:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shoppulse-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shoppulse-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shoppulse-db-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@shoppulse-postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shoppulse-api
  namespace: shoppulse
spec:
  type: NodePort
  selector:
    app: shoppulse-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
