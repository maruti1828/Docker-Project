name: ShopPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shoppulse_test
          POSTGRES_USER: shoppulse
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoppulse -d shoppulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://shoppulse:test_password@localhost:5432/shoppulse_test

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maruti1828/shoppulse
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  verify-image:
    name: Verify published Docker image
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test network and PostgreSQL
        run: |
          docker network create shoppulse-test

          docker run -d \
            --name shoppulse-db \
            --network shoppulse-test \
            --network-alias db \
            -e POSTGRES_DB=shoppulse \
            -e POSTGRES_USER=shoppulse \
            -e POSTGRES_PASSWORD=localdev123 \
            --health-cmd="pg_isready -U shoppulse -d shoppulse" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=10 \
            postgres:16

          for i in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' shoppulse-db)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs shoppulse-db
          exit 1

      - name: Start published ShopPulse image
        run: |
          docker run -d \
            --name shoppulse-api \
            --network shoppulse-test \
            -e DATABASE_URL=postgresql+psycopg://shoppulse:localdev123@db:5432/shoppulse \
            -p 127.0.0.1:8000:8000 \
            ghcr.io/maruti1828/shoppulse:latest

      - name: Verify application health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Published image passed its health check."
              exit 0
            fi
            sleep 2
          done

          docker logs shoppulse-api
          exit 1
